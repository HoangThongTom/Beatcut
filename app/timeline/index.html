<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="timeline.css"><script defer src="timeline.js"></script></head>
<body>
<p id="help">Drag cards to reorder, or use the arrows. Drag Start / End handles to trim source footage. On a focused handle, arrow keys adjust by 0.01s, or jump between beats with Snap enabled. Apply before exporting. Snap aligns the edited clip's outgoing cut to the music; later cuts may shift.</p>
<div id="track" aria-label="Highlight timeline" aria-describedby="help"></div>
<div class="toolbar"><button id="apply" disabled>Apply timeline edits</button>
<span id="summary" role="status" aria-live="polite"></span></div>
</body></html>
