<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="timeline.css"><script defer src="timeline.js"></script></head>
<body>
<p id="help">Drag clips left or right to reorder, then apply. On touch screens or with a keyboard, use the arrow buttons. Horizontal scrolling reveals more clips.</p>
<div id="track" aria-label="Highlight timeline" aria-describedby="help"></div>
<div class="toolbar"><button id="apply" disabled>Apply timeline order</button>
<span id="summary" role="status" aria-live="polite"></span></div>
</body></html>
